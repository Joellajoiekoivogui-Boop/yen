# Configuration Supabase CLI (développement local : `supabase start`)
project_id = "yen-career-bridge"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 16

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 10
password_requirements = "lower_upper_letters_digits"

[auth.rate_limit]
email_sent = 4
sign_in_sign_ups = 30
token_verifications = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "60s"
# Code de vérification envoyé à l'inscription (généré et vérifié par Supabase Auth)
otp_length = 6
otp_expiry = 3600

[auth.email.template.confirmation]
subject = "Votre code de vérification YEN Career Bridge"
content_path = "./supabase/templates/confirmation.html"

# Envoi par Resend (SMTP). En production, ces réglages se saisissent dans le tableau de bord
# Supabase (Authentication › Emails › SMTP Settings) : voir docs/EMAILS-RESEND.md.
# Pour le développement avec la CLI, décommenter et définir RESEND_API_KEY dans l'environnement
# (jamais dans ce fichier) :
# [auth.email.smtp]
# enabled = true
# host = "smtp.resend.com"
# port = 465
# user = "resend"
# pass = "env(RESEND_API_KEY)"
# admin_email = "no-reply@votre-domaine.org"
# sender_name = "YEN Career Bridge"
